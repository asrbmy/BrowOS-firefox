<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Stack falling blocks and clear lines.">
	<title>Tetris</title>
	<link rel="stylesheet" href="../shared/base.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="tetris">
		<div class="tetris-stage">
			<canvas id="board" width="300" height="600"></canvas>
			<div class="tetris-overlay" id="overlay">Press Enter to start</div>
		</div>

		<div class="tetris-side">
			<div class="tetris-box">
				<div class="muted">Next</div>
				<canvas id="next" width="96" height="96"></canvas>
			</div>

			<div class="tetris-box">
				<div class="muted">Hold (C)</div>
				<canvas id="hold" width="96" height="96"></canvas>
			</div>

			<div class="tetris-stats">
				<div>Score <b id="score">0</b></div>
				<div>Lines <b id="lines">0</b></div>
				<div>Level <b id="level">1</b></div>
				<div>Best <b id="best">0</b></div>
			</div>

			<div class="tetris-help muted">
				← → move<br>
				↑ / X rotate<br>
				Z rotate back<br>
				↓ soft drop<br>
				Space hard drop<br>
				P pause
			</div>
		</div>
	</div>

	<script src="../shared/theme.js"></script>
	<script src="app.js"></script>
</body>
</html>
