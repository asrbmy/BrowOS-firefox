<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="A small code and text editor with syntax colors that saves to Files.">
	<title>Code Editor</title>
	<link rel="stylesheet" href="../shared/base.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="ce">
		<div class="ce-bar">
			<button id="newButton">New</button>
			<button id="openButton">Open…</button>
			<button id="saveButton" class="primary">Save</button>
			<button id="saveAsButton">Save as…</button>
			<span class="ce-name" id="name">Untitled.txt</span>
			<label class="ce-wrap"><input type="checkbox" id="wrap"> Wrap</label>
		</div>
		<div class="ce-editor" id="editor">
			<pre class="ce-lines" id="lines" aria-hidden="true"></pre>
			<div class="ce-code">
				<pre class="ce-highlight" id="highlight" aria-hidden="true"></pre>
				<textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor"></textarea>
			</div>
		</div>
		<div class="ce-status muted" id="status"></div>
		<input type="file" id="fileInput" hidden>
	</div>
	<script src="../shared/theme.js"></script>
	<script src="highlight.js"></script>
	<script src="app.js"></script>
</body>
</html>
