<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Sudoku with three difficulty levels, notes and hints.">
	<title>Sudoku</title>
	<link rel="stylesheet" href="../shared/base.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="sudoku">
		<div class="su-top">
			<select id="level" title="Difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
			<button id="newGame" class="primary">New game</button>
			<span class="su-time" id="time">00:00</span>
			<span class="muted" id="best"></span>
		</div>
		<div class="su-stage"><div class="su-board" id="board" role="grid" aria-label="Sudoku board"></div></div>
		<div class="su-pad" id="pad"></div>
		<div class="su-top">
			<button id="notes">Notes: off</button>
			<button id="hint">Hint</button>
			<button id="check">Check</button>
			<span class="su-msg" id="msg" role="status"></span>
		</div>
	</div>
	<script src="../shared/theme.js"></script>
	<script src="sudoku-core.js"></script>
	<script src="app.js"></script>
</body>
</html>
