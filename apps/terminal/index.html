<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="A small command line to open apps, change the theme and more.">
	<title>Terminal</title>
	<link rel="stylesheet" href="../shared/base.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="term" id="term">
		<div class="term-output" id="output" aria-live="polite"></div>

		<div class="term-line">
			<span class="term-prompt">browos@desktop:~$</span>
			<input type="text" id="input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Command">
		</div>
	</div>

	<script src="../shared/theme.js"></script>
	<script src="../../js/calc.js"></script>
	<script src="app.js"></script>
</body>
</html>
